[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs336"
version = "0.1.0"
description = "CS336 学习记录、字节级 BPE 分词器与 Transformer 语言模型"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.4.6",
    "regex",
    "torch>=2.14.1",
]

[tool.setuptools.packages.find]
where = ["assignment1-basics"]
include = ["cs336_basics*"]
